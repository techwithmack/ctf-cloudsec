name: Provision team environments

# Lets organizers spin up (or re-apply) as many teams' environments as they want in
# one run. Fans out to one job per team_id so teams provision in parallel and one
# team's failure doesn't block the rest. Requires ci-bootstrap/ to have been applied
# once (remote state bucket/lock table + the OIDC role this workflow assumes) and
# both challenges' bootstrap/ stacks to already be applied - see README.md.

run-name: Provision ${{ inputs.team_ids }} (request ${{ inputs.challenge_request_id }})

on:
  workflow_dispatch:
    inputs:
      team_ids:
        description: 'Team IDs to provision, comma and/or newline separated (e.g. "team-01, team-02, team-03")'
        required: true
        type: string
      challenge_request_id:
        description: 'Unique request ID for correlation'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      teams: ${{ steps.parse.outputs.teams }}
    steps:
      - id: parse
        name: Parse team_ids into a JSON list
        run: |
          teams_json=$(printf '%s' "$TEAM_IDS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R . | jq -sc .)
          echo "Teams: $teams_json"
          echo "Request ID: $CHALLENGE_REQUEST_ID"
          echo "teams=$teams_json" >> "$GITHUB_OUTPUT"
        env:
          TEAM_IDS: ${{ inputs.team_ids }}
          CHALLENGE_REQUEST_ID: ${{ inputs.challenge_request_id }}

  provision:
    needs: prepare
    if: needs.prepare.outputs.teams != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # required to fetch the OIDC token for AWS role assumption
      contents: read
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJson(needs.prepare.outputs.teams) }}
    concurrency:
      # Guards against two runs (or provision + destroy) racing the same team's
      # Terraform workspace at once.
      group: ctf-team-${{ matrix.team }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Provision ${{ matrix.team }}
        run: ./scripts/add-team.sh "${{ matrix.team }}"
