name: Provision team environments

# Lets organizers spin up (or re-apply) as many teams' environments as they want in
# one run. Fans out to one job per team_id so teams provision in parallel and one
# team's failure doesn't block the rest. Requires ci-bootstrap/ to have been applied
# once (remote state bucket/lock table + the OIDC role this workflow assumes) and
# both challenges' bootstrap/ stacks to already be applied - see README.md.

run-name: Provision ${{ inputs.team_ids }} (request ${{ inputs.challenge_request_id }})

on:
  workflow_dispatch:
    inputs:
      team_ids:
        description: 'Team IDs to provision, comma and/or newline separated (e.g. "team-01, team-02, team-03")'
        required: true
        type: string
      challenge_request_id:
        description: 'Unique request ID for correlation'
        required: true
        type: string
        # No default: this is required, but the type system alone doesn't stop
        # an empty-string dispatch, so the prepare job re-validates it below.

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      teams: ${{ steps.parse.outputs.teams }}
    steps:
      - id: parse
        name: Parse and validate team_ids into a JSON list
        run: |
          teams_json=$(printf '%s' "$TEAM_IDS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R . | jq -sc .)

          # team_id flows straight into a Terraform workspace name, an ALB
          # host-header rule, and a DNS subdomain. This was fine when only an
          # organizer typed team names by hand; now that an external bridge
          # can dispatch this workflow on a player's behalf, reject anything
          # that isn't a safe token before it reaches Terraform.
          invalid=$(printf '%s' "$teams_json" | jq -r '.[] | select(test("^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$") | not)')
          if [ -n "$invalid" ]; then
            echo "Invalid team_id(s) - must match ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?\$ :" >&2
            echo "$invalid" >&2
            exit 1
          fi

          # Defense-in-depth against a runaway/duplicated bridge call fanning
          # out an unbounded number of teams in one dispatch: each team is its
          # own matrix job against the same shared ALB (default quota of 100
          # listener rules) and the same shared AWS OIDC role, concurrently.
          # A human typing team_ids by hand never hit this; an external bridge
          # dispatching on a player's behalf can, by bug or replay. If you
          # legitimately need more than this in one run, split into multiple
          # dispatches rather than raising this cap casually.
          team_count=$(printf '%s' "$teams_json" | jq 'length')
          if [ "$team_count" -gt "$MAX_TEAMS" ]; then
            echo "::error::Refusing to provision $team_count teams in one dispatch (max $MAX_TEAMS). Split into multiple runs." >&2
            exit 1
          fi

          # challenge_request_id is echoed into this run's display name and
          # forwarded to the bridge for correlation - keep it to a boring safe
          # token so it can't inject stray content into either.
          if ! printf '%s' "$CHALLENGE_REQUEST_ID" | grep -qE '^[A-Za-z0-9._-]{1,128}$'; then
            echo "::error::Invalid challenge_request_id - must match ^[A-Za-z0-9._-]{1,128}\$" >&2
            exit 1
          fi

          echo "Teams: $teams_json"
          echo "Request ID: $CHALLENGE_REQUEST_ID"
          echo "teams=$teams_json" >> "$GITHUB_OUTPUT"
        env:
          TEAM_IDS: ${{ inputs.team_ids }}
          CHALLENGE_REQUEST_ID: ${{ inputs.challenge_request_id }}
          MAX_TEAMS: 20

  provision:
    needs: prepare
    if: needs.prepare.outputs.teams != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # required to fetch the OIDC token for AWS role assumption
      contents: read
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJson(needs.prepare.outputs.teams) }}
    concurrency:
      # Guards against two runs (or provision + destroy) racing the same team's
      # Terraform workspace at once.
      group: ctf-team-${{ matrix.team }}
      cancel-in-progress: false
    steps:
      # Pinned to commit SHA, not the moving @v4/@v3 tag - this job assumes a
      # real AWS OIDC role and now runs unattended off an external bridge's
      # dispatch, so a compromised or re-tagged upstream action would run with
      # that role's credentials. Bump the SHA (with the version comment) when
      # deliberately upgrading, never just to "pick up latest".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # this job never pushes back to git
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Provision ${{ matrix.team }}
        id: provision
        run: ./scripts/add-team.sh "${{ matrix.team }}"

      - name: Check bridge webhook configured
        # The `secrets` context cannot be referenced inside an `if:` expression
        # at all - GitHub's parser rejects it outright ("Unrecognized
        # named-value: 'secrets'"), unlike `env:`, where secrets work fine.
        # This step exists purely to move that check into a step output the
        # next step's `if:` can actually read.
        id: check_webhook
        env:
          WEBHOOK_URL: ${{ secrets.CTF_BRIDGE_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify bridge
        # Skips cleanly until CTF_BRIDGE_WEBHOOK_URL is configured, so this is
        # safe to ship before Cloud Village's endpoint is ready. success() is
        # explicit here because setting any `if:` replaces the step's default
        # "only run if the job hasn't already failed" check, not ANDs with it.
        if: ${{ success() && steps.check_webhook.outputs.configured == 'true' }}
        env:
          WEBHOOK_URL: ${{ secrets.CTF_BRIDGE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.CTF_BRIDGE_WEBHOOK_SECRET }}
          TEAM_ID: ${{ matrix.team }}
          REQUEST_ID: ${{ inputs.challenge_request_id }}
          CHALLENGE1_URL: ${{ steps.provision.outputs.challenge1_url }}
          CHALLENGE2_URL: ${{ steps.provision.outputs.challenge2_url }}
          CHALLENGE2_USERNAME: ${{ steps.provision.outputs.challenge2_username }}
          CHALLENGE2_PASSWORD: ${{ steps.provision.outputs.challenge2_password }}
        run: |
          # Refuse to send Challenge 2 credentials anywhere but TLS. Catches a
          # misconfigured secret (http://, or a typo) before it leaks
          # anything, rather than after.
          case "$WEBHOOK_URL" in
            https://*) ;;
            *) echo "::error::CTF_BRIDGE_WEBHOOK_URL must be https:// - refusing to send team credentials over an unencrypted or unexpected scheme" >&2; exit 1 ;;
          esac

          payload=$(jq -nc \
            --arg team_id "$TEAM_ID" \
            --arg request_id "$REQUEST_ID" \
            --arg c1_url "$CHALLENGE1_URL" \
            --arg c2_url "$CHALLENGE2_URL" \
            --arg c2_username "$CHALLENGE2_USERNAME" \
            --arg c2_password "$CHALLENGE2_PASSWORD" \
            '{team_id:$team_id, challenge_request_id:$request_id,
              challenge1:{url:$c1_url},
              challenge2:{url:$c2_url, username:$c2_username, password:$c2_password}}')

          # HMAC-SHA256 over the raw body, hex-encoded, same convention as
          # GitHub's own webhook signing - Cloud Village verifies this against
          # CTF_BRIDGE_WEBHOOK_SECRET before trusting the payload.
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')

          # -f dropped in favor of capturing the status code ourselves: a
          # silent curl failure here would otherwise look identical to "the
          # bridge received it fine" from the job's perspective. --max-time
          # caps a hung endpoint instead of riding out the full 30-minute job
          # timeout for one matrix leg.
          http_status=$(curl -s -o /tmp/bridge-response.txt -w '%{http_code}' \
            --max-time 15 --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: sha256=$signature" \
            -d "$payload")

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Bridge webhook returned HTTP $http_status for $TEAM_ID (request $REQUEST_ID) - the environment IS provisioned, but the bridge was not notified. Recover credentials manually: see PROVISIONING.md#reading-a-teams-flag-or-credentials." >&2
            exit 1
          fi
          echo "Bridge notified for $TEAM_ID (request $REQUEST_ID): HTTP $http_status"
