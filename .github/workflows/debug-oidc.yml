name: Debug OIDC token claims (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::368738063393:role/ctf-github-actions-provisioner
          aws-region: us-west-2

      - run: aws sts get-caller-identity
