name: Reap expired team environments

# Enforces the 1-hour environment TTL for self-serve provisioning (see the
# 2026-08 Discord thread with CTF Ops/Techops): runs on a schedule, checks
# every active team workspace in both challenges against AWS's own record of
# when that team's ECS service was created, and destroys anything past the
# limit via the same scripts/remove-team.sh used by the manual destroy
# workflow. No destroy-approval gate here on purpose - enforcing the TTL
# without waiting on a human is the entire point.
#
# Matrixed per team (like destroy-teams.yml), NOT a single sequential job -
# found live on 2026-08-04/05: a single job destroying N expired teams one
# after another routinely blew past its own 30-minute timeout (each team's
# Forgejo/EFS/EC2 teardown took several minutes), and when GitHub force-cancels
# a job mid-`terraform destroy`, the DynamoDB state lock is never released,
# permanently stranding that team until someone notices and force-unlocks it
# by hand. Matrixing means one slow/stuck team can no longer starve every
# other expired team of its own destroy window, and each matrix entry gets
# its own timeout. scripts/remove-team.sh also now self-heals a stale lock
# from a *previous* interrupted run (see its destroy_with_lock_retry), as a
# second line of defense.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      ttl_minutes:
        description: 'Override the TTL in minutes (for testing the reaper itself)'
        required: false
        type: string
        default: '60'

permissions:
  contents: read

jobs:
  authorize:
    # Only gates manual workflow_dispatch - the schedule trigger has no
    # "actor" to check and must never be blocked, since unattended TTL
    # enforcement is this workflow's entire purpose. Same rationale as
    # destroy-teams.yml's authorize job: a bridge PAT only needs Actions:write
    # to dispatch ANY workflow in the repo, including this one, and this one
    # has no destroy-approval gate at all by design - so it's the single most
    # dangerous workflow for an unintended actor to reach. Falls back to just
    # the repo owner if ORGANIZER_GITHUB_LOGINS is unset - do NOT default this
    # to every current collaborator: `maxdotdotg` has Write access (needed so
    # its PAT can dispatch provision-teams.yml) but is Jayesh/Cloud Village's
    # bridge identity, exactly the actor this guard exists to keep out.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify manual-dispatch actor is an authorized organizer
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED: ${{ vars.ORGANIZER_GITHUB_LOGINS }}
        run: |
          allowed="${ALLOWED:-techwithmack}"
          if ! printf '%s' "$allowed" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -qxF "$ACTOR"; then
            echo "::error::Manual dispatch of this workflow is restricted to organizers ($allowed). Actor '$ACTOR' is not authorized." >&2
            exit 1
          fi
          echo "Dispatch authorized for $ACTOR"

  list-expired:
    needs: authorize
    # authorize is skipped (not failed) on a schedule trigger - proceed in
    # that case, and also when authorize actually succeeded. Any other result
    # (authorize failed a manual dispatch) blocks this and everything after.
    if: always() && (needs.authorize.result == 'success' || needs.authorize.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      teams: ${{ steps.list.outputs.teams }}
    permissions:
      id-token: write # required to fetch the OIDC token for AWS role assumption
      contents: read
    steps:
      # Pinned to commit SHA - see the matching comment in provision-teams.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # this job never pushes back to git

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - id: list
        name: List expired teams
        run: |
          ttl_minutes="${{ inputs.ttl_minutes || 60 }}"
          if ! [[ "$ttl_minutes" =~ ^[0-9]+$ ]]; then
            echo "::error::ttl_minutes must be a non-negative integer, got: $ttl_minutes" >&2
            exit 1
          fi
          # Independent of the actor check above: a fat-fingered override
          # (e.g. testing "1" and meaning team count, or a stray "0") would
          # otherwise sweep every active team across the whole event almost
          # immediately, even for an authorized organizer. If you genuinely
          # need faster-than-5-minute testing, do it against a disposable
          # team_id, not by lowering this floor.
          if [ "$ttl_minutes" -lt 5 ]; then
            echo "::error::ttl_minutes must be at least 5 (got $ttl_minutes) - lower values risk tearing down every active team almost immediately." >&2
            exit 1
          fi
          teams_json=$(./scripts/reap-teams.sh --list "$((ttl_minutes * 60))" | jq -R . | jq -sc .)
          echo "Expired teams: $teams_json"
          echo "teams=$teams_json" >> "$GITHUB_OUTPUT"

  reap:
    needs: list-expired
    if: needs.list-expired.outputs.teams != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # required to fetch the OIDC token for AWS role assumption
      contents: read
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJson(needs.list-expired.outputs.teams) }}
    concurrency:
      # Same group destroy-teams.yml/provision-teams.yml use for this team_id -
      # guards against the reaper racing a concurrent manual provision/destroy.
      group: ctf-team-${{ matrix.team }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # this job never pushes back to git

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Destroy expired team ${{ matrix.team }}
        run: ./scripts/remove-team.sh "${{ matrix.team }}" --yes
