name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Terraform
        run: terraform fmt -check -recursive terraform/ || true

      - name: Run tests
        run: echo "No test suite wired up yet - tracked in INFRA-92"
